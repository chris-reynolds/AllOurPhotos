<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Pad Mode</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #FFFFFF !important;
            overflow: hidden;
            /* Hides the cursor so it doesn't get in the way of tracing */
            cursor: none; 
            /* Prevents selecting text or UI elements accidentally */
            user-select: none;
            -webkit-user-select: none;
        }
        /* Tiny, unobtrusive reminder that fades out */
        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-family: sans-serif;
            font-size: 14px;
            color: #CCCCCC;
            pointer-events: none;
            animation: fadeOut 4s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="instruction">Press F11 for Full Screen. Move mouse to edge to exit.</div>

</body>
</html>
